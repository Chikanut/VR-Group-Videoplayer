<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="470" fill="#0f1117"/>

  <!-- modal card -->
  <rect x="30" y="24" width="500" height="422" rx="12" fill="#1a1d27" stroke="#2d3148" stroke-width="1.5"/>

  <!-- header -->
  <text x="52" y="62" fill="#e2e4ea" font-size="18" font-weight="700">Quest 3 &#8212; Row 1</text>
  <text x="500" y="60" fill="#8a8fa0" font-size="20" text-anchor="end">&#215;</text>

  <text x="52" y="94" fill="#34c759" font-size="12">Connected &#183; battery 85%</text>
  <line x1="52" y1="108" x2="508" y2="108" stroke="#2d3148"/>

  <!-- audio slider -->
  <text x="52" y="134" fill="#8a8fa0" font-size="11">Device volume</text>
  <line x1="52" y1="150" x2="360" y2="150" stroke="#2d3148" stroke-width="4" stroke-linecap="round"/>
  <line x1="52" y1="150" x2="270" y2="150" stroke="#5b7fff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="270" cy="150" r="6" fill="#5b7fff"/>
  <text x="376" y="154" fill="#e2e4ea" font-size="11">70%</text>

  <!-- playback controls -->
  <text x="52" y="188" fill="#e2e4ea" font-size="13" font-weight="600">Playback Controls</text>
  <g font-size="12" text-anchor="middle">
    <rect x="52" y="200" width="86" height="30" rx="6" fill="#34c759"/>
    <text x="95" y="220" fill="#06210f" font-weight="700">Open Video</text>
    <rect x="146" y="200" width="60" height="30" rx="6" fill="#262a3a" stroke="#2d3148"/>
    <text x="176" y="220" fill="#e2e4ea">Play</text>
    <rect x="214" y="200" width="60" height="30" rx="6" fill="#262a3a" stroke="#2d3148"/>
    <text x="244" y="220" fill="#e2e4ea">Pause</text>
    <rect x="282" y="200" width="56" height="30" rx="6" fill="#262a3a" stroke="#2d3148"/>
    <text x="310" y="220" fill="#e2e4ea">Stop</text>
    <rect x="346" y="200" width="80" height="30" rx="6" fill="#262a3a" stroke="#2d3148"/>
    <text x="386" y="220" fill="#e2e4ea">Recenter</text>
  </g>

  <!-- playback state -->
  <text x="52" y="266" fill="#8a8fa0" font-size="12">State: playing  |  Mode: 360  |  lesson_01.mp4</text>

  <!-- NEW per-device seek (highlighted) -->
  <rect x="44" y="284" width="472" height="70" rx="10" fill="#141a2e" stroke="#ffb833" stroke-width="2"/>
  <line x1="60" y1="320" x2="440" y2="320" stroke="#2d3148" stroke-width="5" stroke-linecap="round"/>
  <line x1="60" y1="320" x2="140" y2="320" stroke="#ffb833" stroke-width="5" stroke-linecap="round"/>
  <circle cx="140" cy="320" r="7" fill="#ffb833"/>
  <text x="60" y="344" fill="#e2e4ea" font-size="12">0:45 / 3:40</text>
  <text x="452" y="316" fill="#ffb833" font-size="11" font-weight="700">Seek</text>

  <!-- callout -->
  <rect x="44" y="374" width="472" height="52" rx="10" fill="#2a2410" stroke="#ffb833" stroke-width="1.5"/>
  <text x="60" y="398" fill="#ffe0a3" font-size="13" font-weight="700">New in 1.6.0 &#183; Per-headset Seek</text>
  <text x="60" y="416" fill="#ffe0a3" font-size="12">Drag to scrub only this one headset, without affecting the rest.</text>
</svg>
