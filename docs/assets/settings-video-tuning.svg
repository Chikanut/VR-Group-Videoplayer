<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="560" fill="#0f1117"/>

  <!-- Card -->
  <rect x="20" y="20" width="720" height="520" rx="12" fill="#1a1d27" stroke="#2d3148" stroke-width="1.5"/>

  <!-- header -->
  <text x="44" y="58" fill="#e2e4ea" font-size="18" font-weight="700">Lesson 01</text>
  <rect x="530" y="40" width="90" height="28" rx="6" fill="#262a3a" stroke="#2d3148"/>
  <text x="575" y="59" fill="#e2e4ea" font-size="12" text-anchor="middle">Duplicate</text>
  <rect x="630" y="40" width="86" height="28" rx="6" fill="#3a1e22" stroke="#ff4b4b"/>
  <text x="673" y="59" fill="#ff8a8a" font-size="12" text-anchor="middle">Remove</text>

  <!-- basic fields row -->
  <g font-size="11">
    <text x="44" y="92" fill="#8a8fa0">Name</text>
    <rect x="44" y="98" width="150" height="30" rx="6" fill="#262a3a" stroke="#2d3148"/>
    <text x="54" y="118" fill="#e2e4ea" font-size="12">Lesson 01</text>

    <text x="210" y="92" fill="#8a8fa0">Filename</text>
    <rect x="210" y="98" width="180" height="30" rx="6" fill="#262a3a" stroke="#2d3148"/>
    <text x="220" y="118" fill="#e2e4ea" font-size="12">lesson_01.mp4</text>

    <text x="406" y="92" fill="#8a8fa0">Type</text>
    <rect x="406" y="98" width="80" height="30" rx="6" fill="#262a3a" stroke="#2d3148"/>
    <text x="416" y="118" fill="#e2e4ea" font-size="12">360  &#9662;</text>

    <text x="502" y="92" fill="#8a8fa0">Placement</text>
    <rect x="502" y="98" width="110" height="30" rx="6" fill="#262a3a" stroke="#2d3148"/>
    <text x="512" y="118" fill="#e2e4ea" font-size="12">Default &#9662;</text>

    <text x="628" y="92" fill="#8a8fa0">Loop</text>
    <rect x="628" y="103" width="20" height="20" rx="4" fill="#262a3a" stroke="#2d3148"/>
  </g>

  <!-- Advanced Settings disclosure -->
  <line x1="44" y1="150" x2="716" y2="150" stroke="#2d3148"/>
  <text x="44" y="176" fill="#5b7fff" font-size="14" font-weight="600">&#9662; Advanced Settings</text>

  <!-- Override Material Settings checkbox -->
  <rect x="44" y="192" width="18" height="18" rx="4" fill="#5b7fff"/>
  <path d="M48,201 l4,4 l7,-8" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="72" y="206" fill="#e2e4ea" font-size="13" font-weight="600">Override Material Settings</text>

  <!-- material fields grid -->
  <g font-size="11">
    <text x="44" y="240" fill="#8a8fa0">Brightness</text>
    <rect x="44" y="246" width="120" height="28" rx="6" fill="#262a3a" stroke="#2d3148"/>
    <text x="54" y="265" fill="#e2e4ea" font-size="12">1.00</text>

    <text x="180" y="240" fill="#8a8fa0">Tint R / G / B</text>
    <rect x="180" y="246" width="120" height="28" rx="6" fill="#262a3a" stroke="#2d3148"/>
    <text x="190" y="265" fill="#e2e4ea" font-size="12">1  1  1</text>

    <text x="316" y="240" fill="#8a8fa0">Tiling X / Y</text>
    <rect x="316" y="246" width="120" height="28" rx="6" fill="#262a3a" stroke="#2d3148"/>
    <text x="326" y="265" fill="#e2e4ea" font-size="12">1.00  1.00</text>

    <text x="452" y="240" fill="#8a8fa0">Offset X / Y</text>
    <rect x="452" y="246" width="120" height="28" rx="6" fill="#262a3a" stroke="#2d3148"/>
    <text x="462" y="265" fill="#e2e4ea" font-size="12">0.00  0.00</text>
  </g>

  <!-- highlighted crop fields -->
  <rect x="36" y="300" width="340" height="86" rx="10" fill="#141a2e" stroke="#ffb833" stroke-width="2"/>
  <g font-size="11">
    <text x="52" y="326" fill="#ffb833" font-weight="600">Top Crop</text>
    <rect x="52" y="332" width="140" height="34" rx="6" fill="#262a3a" stroke="#ffb833"/>
    <text x="64" y="354" fill="#e2e4ea" font-size="14">0.03</text>

    <text x="212" y="326" fill="#ffb833" font-weight="600">Bottom Crop</text>
    <rect x="212" y="332" width="140" height="34" rx="6" fill="#262a3a" stroke="#ffb833"/>
    <text x="224" y="354" fill="#e2e4ea" font-size="14">0.03</text>
  </g>

  <!-- callout -->
  <path d="M376,343 L430,343" stroke="#ffb833" stroke-width="2"/>
  <rect x="430" y="312" width="286" height="66" rx="10" fill="#2a2410" stroke="#ffb833" stroke-width="1.5"/>
  <text x="446" y="336" fill="#ffe0a3" font-size="13" font-weight="700">Remove black bars here</text>
  <text x="446" y="356" fill="#ffe0a3" font-size="12">Raise both in small steps (0.02, 0.03…)</text>
  <text x="446" y="372" fill="#ffe0a3" font-size="12">until the black band is gone.</text>

  <!-- save -->
  <rect x="44" y="420" width="90" height="36" rx="8" fill="#5b7fff"/>
  <text x="89" y="443" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Save</text>
  <text x="150" y="443" fill="#8a8fa0" font-size="12">Nothing is sent to headsets until you press Save.</text>

  <text x="44" y="500" fill="#8a8fa0" font-size="12">Tip: crop top and bottom by the same amount to keep the picture centered.</text>
</svg>
